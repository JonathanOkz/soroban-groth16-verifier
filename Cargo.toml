[package]
name = "proof-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "contracts/proof-verifier/src/lib.rs"

[dependencies]
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true
