name: Release contract

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071
    with:
      release_name: ${{ github.ref_name }}
      package: proof-verifier
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
